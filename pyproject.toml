[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-autofill-contours"
version = "0.1.0"
description = "Auto-fill closed RGB contours into Label instances for napari"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scikit-image",
  "magicgui",
  "napari-plugin-engine>=0.2.0",
]

[tool.setuptools]
packages = ["napari_autofill_contours"]

[tool.setuptools.package-data]
napari_autofill_contours = ["napari.yaml"]

[project.entry-points."napari.manifest"]
napari-autofill-contours = "napari_autofill_contours:napari.yaml"
